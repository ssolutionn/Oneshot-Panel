<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Вето карт · Oneshot Panel</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/veto-overlay.css">
  <script type="module" src="/veto-overlay.js"></script>
</head>
<body>
  <!-- OBS browser source, 1920×1080, transparent. The panel sends the veto
       live (obs-browser event) or the link carries it after #s=. -->
  <main class="stage" id="stage" hidden>
    <section class="veto" aria-label="Вето карт">
      <header class="veto-head">
        <div class="veto-team" id="teamA"><span class="veto-logo"><img alt=""></span><b></b></div>
        <div class="veto-title"><span>MAP VETO</span><strong id="vetoFormat"></strong></div>
        <div class="veto-team right" id="teamB"><b></b><span class="veto-logo"><img alt=""></span></div>
      </header>
      <ol class="veto-maps" id="vetoMaps"></ol>
    </section>
  </main>
</body>
</html>
