<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Oneshot Match Scoreboard</title>
  <style>
    :root {
      --bg: transparent;
      --surface: #0a0a0b;
      --surface-2: #141416;
      --ink: #ffffff;
      --muted: #9fc6cf;
      --accent: #00d3ef;
      --ct: #246bde;
      --t: #b45f06;
      --border: #ffffff22;
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px; background: var(--bg); color: var(--ink);
      font-family: var(--font); overflow: hidden; display: flex; justify-content: center; align-items: flex-start;
    }
    .scoreboard {
      display: flex; align-items: center; background: var(--surface);
      border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 30px #0009;
      padding: 12px 24px; gap: 24px; min-width: 680px; backdrop-filter: blur(10px);
    }
    .team {
      display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0;
    }
    .team.right { justify-content: flex-end; text-align: right; }
    .team-name {
      font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .score-box {
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 18px; font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums;
      color: var(--accent); min-width: 64px; text-align: center;
    }
    .match-info {
      display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0 16px;
      border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    }
    .map-name { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; }
    .rounds-live { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .series-format { font-size: 11px; font-weight: 500; color: var(--muted); }
  </style>
</head>
<body>
  <div class="scoreboard" id="scoreboard">
    <div class="team">
      <div class="team-name" id="teamA">Команда А</div>
      <div class="score-box" id="scoreA">0</div>
    </div>
    <div class="match-info">
      <span class="series-format" id="seriesFormat">BO3</span>
      <span class="map-name" id="mapName">Разминка</span>
      <span class="rounds-live" id="roundsLive">— : —</span>
    </div>
    <div class="team right">
      <div class="score-box" id="scoreB">0</div>
      <div class="team-name" id="teamB">Команда Б</div>
    </div>
  </div>

  <script>
    // Чтение состояния из URL или localStorage (синхронизация с панелью)
    function updateScoreboard() {
      const params = new URLSearchParams(location.search);
      const team1 = params.get('t1') || localStorage.getItem('oneshot_sb_t1') || 'Команда А';
      const team2 = params.get('t2') || localStorage.getItem('oneshot_sb_t2') || 'Команда Б';
      const s1 = params.get('s1') || localStorage.getItem('oneshot_sb_s1') || '0';
      const s2 = params.get('s2') || localStorage.getItem('oneshot_sb_s2') || '0';
      const map = params.get('map') || localStorage.getItem('oneshot_sb_map') || 'Mirage';
      const rounds = params.get('rounds') || localStorage.getItem('oneshot_sb_rounds') || '0 : 0';
      const format = params.get('format') || localStorage.getItem('oneshot_sb_format') || 'BO3';

      document.getElementById('teamA').textContent = team1;
      document.getElementById('teamB').textContent = team2;
      document.getElementById('scoreA').textContent = s1;
      document.getElementById('scoreB').textContent = s2;
      document.getElementById('mapName').textContent = map;
      document.getElementById('roundsLive').textContent = rounds;
      document.getElementById('seriesFormat').textContent = format;
    }

    updateScoreboard();
    window.addEventListener('storage', updateScoreboard);
    setInterval(updateScoreboard, 1500); // Опрос хранилища для живого обновления в OBS
  </script>
</body>
</html>
