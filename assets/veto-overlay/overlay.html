<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CyberClash · Map veto</title>
  <link rel="icon" href="/assets/favicon.png">
  <link rel="stylesheet" href="./overlay.css">
</head>
<body>
  <main class="viewport">
    <canvas id="scene" width="1920" height="1080" role="img" aria-label="Вето карт CyberClash"></canvas>
    <p id="sceneStatus" class="sr-only" role="status" aria-live="polite"></p>
  </main>
  <nav id="previewBar" class="preview-bar" aria-label="Предпросмотр оформления" hidden>
    <span class="preview-caption">ПРЕДПРОСМОТР <small>Тестовое вето</small></span>
    <label>Вид <select id="layout"><option value="full">Полный экран</option><option value="strip">Плашка для ведущих</option></select></label>
    <label>Формат <select id="format"><option>BO1</option><option>BO2</option><option selected>BO3</option><option>BO5</option></select></label>
    <div class="playback">
      <button id="restart" type="button" title="Сначала">↺</button>
      <button id="previous" type="button" title="Отменить ход">←</button>
      <button id="play" type="button">Проиграть вето</button>
      <button id="next" type="button" title="Следующий ход">→</button>
    </div>
    <button id="finish" type="button">Показать итог</button>
    <label class="motion"><input id="motion" type="checkbox" checked> Дым</label>
    <button id="download" class="download" type="button" disabled>Скачать PNG</button>
    <span id="previewStatus" class="preview-status" role="status"></span>
  </nav>
  <script type="module" src="./overlay.js"></script>
</body>
</html>
