name: Match day broadcast package

on:
  push:
    branches: ["codex/matchday-player-packages"]
  workflow_dispatch:
    inputs:
      day:
        description: "Confirmed match date, DD.MM"
        required: true
        default: "15.10"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      MATCH_DAY: ${{ inputs.day || '15.10' }}
    steps:
      - name: Check the match date
        run: |
          pattern='^[0-3][0-9]\.[01][0-9]$'
          if [[ ! "$MATCH_DAY" =~ $pattern ]]; then
            echo "::error::Match date must be DD.MM, for example 15.10."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare real player photos
        run: python3 scripts/fetch_player_photos.py --allow-missing
      - name: Generate match collections from the current organizer sheets
        run: |
          node --check scripts/build_match_packages.mjs
          node scripts/build_match_packages.mjs --day="$MATCH_DAY" --out=work/match-package
      - name: Install card renderer
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Install Arial Black, the card font OBS uses on Windows
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y ttf-mscorefonts-installer
          fc-cache -f
          if ! fc-list | grep -i "Arial Black"; then
            echo "::error::Arial Black is missing; baked cards would not match OBS on Windows."
            exit 1
          fi
      - name: Render and verify all broadcast cards
        run: |
          node server.js > "${RUNNER_TEMP}/oneshot-package-server.log" 2>&1 &
          for attempt in $(seq 30); do
            curl -fsS -o /dev/null http://127.0.0.1:3000/ && break
            if [ "$attempt" -eq 30 ]; then
              cat "${RUNNER_TEMP}/oneshot-package-server.log"
              echo "::error::The local panel server did not answer within 30 seconds."
              exit 1
            fi
            sleep 1
          done
          python3 scripts/render_match_cards.py --root work/match-package
      - name: Verify the Windows preparation script
        shell: pwsh
        run: |
          & ./work/match-package/prepare_local.ps1
      - name: Check prepared paths and remove runner-specific JSON
        run: |
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path
          root = Path("work/match-package")
          manifest = json.loads((root / "package-manifest.json").read_text())
          files = list((root / "OBS_LOCAL").glob("*.json"))
          assert len(files) == len(manifest["matches"])
          for path in files:
              document = json.loads(path.read_text(encoding="utf-8-sig"))
              cards = [s for s in document["sources"] if s["name"].startswith("CARD ")]
              assert len(cards) == 10
              assert all(Path(s["settings"]["file"]).is_file() for s in cards)
          shutil.rmtree(root / "OBS_LOCAL")
          PY
      - name: Upload self-contained OBS collections
        uses: actions/upload-artifact@v7
        with:
          name: CyberClash-${{ env.MATCH_DAY }}-2026-OBS
          path: work/match-package/OBS_READY/
          if-no-files-found: error
      - name: Upload ready broadcast package
        uses: actions/upload-artifact@v7
        with:
          name: CyberClash-${{ env.MATCH_DAY }}-2026
          path: work/match-package/
          if-no-files-found: error
      - name: Upload lightweight match previews
        uses: actions/upload-artifact@v7
        with:
          name: CyberClash-match-previews
          path: |
            work/match-package/previews/
            work/match-package/verification.json
          if-no-files-found: error
      - name: Keep verified photos for the publishing job
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/matchday-player-packages'
        uses: actions/upload-artifact@v7
        with:
          name: verified-player-photos
          path: |
            assets/players/players.json
            assets/players/*.png
            assets/players/*.jpg
            assets/players/*.webp
          if-no-files-found: error

  # Only this job can write to the repository; it runs no sheet data or browser.
  publish-photos:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/matchday-player-packages'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: verified-player-photos
          path: assets/players
      - name: Save verified photos for static publishing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          folder = Path("assets/players")
          files = [folder / "players.json", *sorted(p for p in folder.iterdir()
                   if p.suffix.lower() in (".png", ".jpg", ".webp"))]
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "--", *map(str, files)], check=True)
          changed = subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode
          if changed:
              subprocess.run(["git", "commit", "-m", "Publish verified local HLTV photos with their manifest"], check=True)
              subprocess.run(["git", "push", "origin", "HEAD:refs/heads/codex/matchday-player-packages"], check=True)
          PY
