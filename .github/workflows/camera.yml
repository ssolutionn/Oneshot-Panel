name: Camera framing and OBS
on:
  workflow_dispatch:
  push:
    branches: ["codex/veto-resilience-review", "claude/gracious-sagan-apztcc"]
    paths: ["app.js", "core.js", "obs.js", "obs-bridge.js", "live.js", "lobby.js", "notifications.js", "notification-worker.js", "assets/camera/**", "index.html", "style.css", "scripts/qa_camera.py", "scripts/qa_camera_loading.py", "scripts/qa_camera_obs.py", "scripts/qa_notifications.py", "scripts/ci_camera_review.py", "test/camera.test.js", ".github/workflows/camera.yml"]
concurrency:
  group: camera-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  camera:
    if: github.repository == 'ssolutionn/Oneshot-Panel'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check camera editor, collection import and real OBS runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_camera_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camera-framing-and-obs
          path: |
            artifacts/
            ${{ runner.temp }}/oneshot-camera-review/*.log
            ${{ runner.temp }}/oneshot-camera-review/result.json
          if-no-files-found: warn
