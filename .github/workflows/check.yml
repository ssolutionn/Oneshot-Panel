name: Panel checks

on:
  push:
    branches: ["claude/gracious-sagan-apztcc", "codex/oneshot-panel-review-redesign"]
  pull_request:
    branches: ["claude/gracious-sagan-apztcc"]

permissions:
  contents: read
  checks: read

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Photo preparation regression checks
        run: |
          python3 -m pip install pillow  # the LAN photo import (test/import_event_test.py, qa_lan.py)
          python3 -m unittest discover -s test -p '*_test.py'
      - name: Prepare the published static site
        env:
          COMMIT_REF: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("netlify.toml").read_text())
          subprocess.run(config["build"]["command"], shell=True, check=True)
          assert Path("public/assets/card/background.jpg").is_file()
          assert Path("public/assets/card/cyberclash-logo.png").is_file()
          PY
      - name: Syntax and Node tests
        run: npm run check && npm test
      - name: Rebuild Claude artifact
        run: |
          python3 claude-artifact/build_oneshot_artifact.py
          git diff --exit-code -- claude-artifact/oneshot-panel.html
      - name: Install browser QA tools
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium webkit
      - name: Browser regression scenarios
        run: |
          node server.js > "${RUNNER_TEMP}/oneshot-server.log" 2>&1 &
          python3 - <<'PY'
          import argparse
          import asyncio
          import runpy

          qa = runpy.run_path("scripts/qa_browser.py", run_name="oneshot_qa")
          args = argparse.Namespace(
              url="http://127.0.0.1:3000", chromium=None,
              roster=None, schedule=None, artifacts="artifacts"
          )
          asyncio.run(qa["run"](args))
          cards = runpy.run_path("scripts/qa_player_cards.py", run_name="player_card_qa")
          asyncio.run(cards["run"](args))
          bookies = runpy.run_path("scripts/qa_bookies.py", run_name="bookies_qa")
          asyncio.run(bookies["run"](args))
          live = runpy.run_path("scripts/qa_live.py", run_name="live_qa")
          asyncio.run(live["run"](args))
          qr = runpy.run_path("scripts/qa_obs_qr.py", run_name="qr_qa")
          asyncio.run(qr["run"](args))
          veto = runpy.run_path("scripts/qa_veto_site.py", run_name="veto_site_qa")
          asyncio.run(veto["run"](args))
          lan = runpy.run_path("scripts/qa_lan.py", run_name="lan_qa")
          asyncio.run(lan["run"](args))
          cs2 = runpy.run_path("scripts/qa_cs2.py", run_name="cs2_qa")
          asyncio.run(cs2["run"](args))
          PY
      - name: Verify the published site
        # Production follows only this branch; same-repo pull requests get a preview.
        if: (github.event_name == 'push' && github.ref == 'refs/heads/claude/gracious-sagan-apztcc') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          # Production: repository variable PUBLISHED_URL (e.g. the Cloudflare Pages
          # address). Pull requests resolve the matching hosting provider preview.
          SITE_URL: ${{ vars.PUBLISHED_URL || 'https://oneshot-panel.pages.dev' }}
          PREVIEW_URL: ${{ github.event_name == 'pull_request' && format('https://deploy-preview-{0}--onepanel.netlify.app', github.event.pull_request.number) || vars.PUBLISHED_URL || 'https://oneshot-panel.pages.dev' }}
          # scripts/build-site.sh writes the pushed or PR head commit to build.txt.
          EXPECTED_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import argparse
          import asyncio
          import os
          import runpy
          import time
          import json
          import re
          from urllib.parse import urlsplit
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          preview = os.environ["PREVIEW_URL"]
          expected = os.environ["EXPECTED_COMMIT"]
          production = os.environ["SITE_URL"]

          # Cloudflare Pages advertises the immutable preview on the head
          # commit's check run. Trust only the hosting app and our own project.
          host = urlsplit(production).hostname or ""
          if os.environ["IS_PULL_REQUEST"] == "true" and host.endswith(".pages.dev"):
              deadline = time.monotonic() + 360
              while True:
                  api = ("https://api.github.com/repos/" + os.environ["GH_REPOSITORY"] +
                         "/commits/" + expected + "/check-runs")
                  request = Request(api, headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + os.environ["GH_READ_TOKEN"],
                  })
                  with urlopen(request, timeout=20) as response:
                      runs = json.load(response)["check_runs"]
                  found = None
                  for check in runs:
                      if (check.get("app", {}).get("slug") != "cloudflare-workers-and-pages" or
                              check.get("head_sha") != expected or check.get("conclusion") != "success"):
                          continue
                      summary = check.get("output", {}).get("summary") or ""
                      for value in re.findall(r"https://[a-zA-Z0-9.-]+\.pages\.dev", summary):
                          target = urlsplit(value)
                          if target.hostname and target.hostname.endswith("." + host):
                              found = value
                              break
                  if found:
                      preview = found
                      print("CLOUDFLARE_PREVIEW:", preview, flush=True)
                      break
                  assert time.monotonic() < deadline, "No successful Cloudflare preview for this commit."
                  time.sleep(5)

          # Check the published site as its real browser clients do. Some hosts
          # reject a bare HTTP client even when the page is publicly accessible.
          from playwright.sync_api import sync_playwright
          with sync_playwright() as browser_api:
              browser = browser_api.chromium.launch(headless=True)
              page = browser.new_page(extra_http_headers={"Cache-Control":"no-cache"})
              deadline = time.monotonic() + 360
              while True:
                  response = page.goto(preview + "/build.txt", wait_until="domcontentloaded", timeout=30000)
                  status = response.status if response else 0
                  if status == 401 and ".netlify.app" in preview and preview != production:
                      public = page.goto(production + "/card.html", wait_until="domcontentloaded")
                      assert public and public.status == 200
                      print("::notice::Netlify preview requires authentication; prepared-site browser QA passed.")
                      raise SystemExit(0)
                  live = response.text().strip() if response and status == 200 else "(HTTP " + str(status) + ")"
                  print("PUBLISHED_COMMIT:", live[:120], flush=True)
                  if live == expected:
                      break
                  assert time.monotonic() < deadline, "The host has not published this commit."
                  page.wait_for_timeout(5000)
              card = page.goto(preview + "/card.html", wait_until="domcontentloaded", timeout=30000)
              assert card and card.status == 200
              assert "img-src 'self'" in card.headers.get("content-security-policy", "")
              browser.close()
          args = argparse.Namespace(
              url=preview, chromium=None, roster=None, schedule=None,
              artifacts="artifacts/published",
              catalog_url=preview + "/assets/players/players.json"
          )
          panel = runpy.run_path("scripts/qa_browser.py", run_name="published_panel")
          cards = runpy.run_path("scripts/qa_player_cards.py", run_name="published_cards")
          live = runpy.run_path("scripts/qa_live.py", run_name="published_live")
          veto = runpy.run_path("scripts/qa_veto_site.py", run_name="published_veto")
          try:
              asyncio.run(panel["run"](args))
              asyncio.run(live["run"](args))
              asyncio.run(veto["run"](args))
              lan = runpy.run_path("scripts/qa_lan.py", run_name="published_lan")
              asyncio.run(lan["run"](args))
              bookies = runpy.run_path("scripts/qa_bookies.py", run_name="published_bookies")
              asyncio.run(bookies["run"](args))
              api = runpy.run_path("scripts/qa_bookies_api.py", run_name="published_bookies_api")
              asyncio.run(api["run"](args))
          finally:
              asyncio.run(cards["run"](args))
          PY
      - name: Upload browser screenshots and sample OBS export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel-browser-qa
          path: artifacts/
          if-no-files-found: ignore
      - name: Upload ready-to-publish static site
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: oneshot-panel-site
          path: public/
          if-no-files-found: error
