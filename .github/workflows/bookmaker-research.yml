name: Public bookmaker reader investigation
on:
  push:
    branches: ["codex/bookmaker-public-probe"]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read precise anonymous line contracts
        run: |
          python3 - <<'PY'
          import json,re
          from concurrent.futures import ThreadPoolExecutor
          from urllib.request import Request,urlopen
          def read(pair):
           label,url=pair
           try:
            with urlopen(Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=18) as r:text=r.read(12000000).decode("utf8","replace");status=r.status
            data={"provider":label,"status":status,"size":len(text)}
            if label=="winline-time":
             data["excerpts"]=[text[max(0,m.start()-220):m.end()+500] for m in list(re.finditer("TZ_OFFSET_MS",text))[:15]]
            elif label=="baltbet-line":
             data["cyberclash"]=[text[max(0,m.start()-350):m.end()+2200] for m in list(re.finditer("cyber.?clash",text,re.I))[:10]]
             data["sample"]=text[text.find('data-event-id'):text.find('data-event-id')+5000]
             data["dataAttrs"]=list(dict.fromkeys(re.findall(r"data-([a-z-]+)=",text)))[:80]
             data["scripts"]=re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)',text)[:15]
            print("FINAL_PUBLIC:",json.dumps(data,ensure_ascii=False),flush=True)
           except Exception as e:print("FINAL_PUBLIC:",json.dumps({"provider":label,"error":str(e)[:100]}),flush=True)
          with ThreadPoolExecutor(max_workers=3) as pool:list(pool.map(read,[
           ("winline-time","https://winline.ru/main.2485c5709989c6dc.js"),
           ("baltbet-line","https://baltbet.ru/prematch/cybersport")
          ]))
          base="https://siteapi.betboom.ru/api/site_api/v1/"
          for path,body in [
           ("sporthub/search/get_tournaments",{"query":"CyberClash","page":1,"limit":20}),
           ("sporthub/search/get",{"query":"CyberClash","page":1,"limit":20})
          ]:
           try:
            request=Request(base+path,data=json.dumps(body).encode(),headers={"Content-Type":"application/json","Accept":"application/json"},method="POST")
            with urlopen(request,timeout=15) as r:
             data=json.load(r);status=r.status
            data={k:v for k,v in data.items() if not k.startswith("_") and not re.search("token|secret|session|auth|user|account",k,re.I)}
            print("BETBOOM_PUBLIC_QUERY:",json.dumps({"path":path,"status":status,"response":data},ensure_ascii=False)[:40000],flush=True)
           except Exception as e:print("BETBOOM_PUBLIC_QUERY:",json.dumps({"path":path,"error":str(e)[:100]}),flush=True)
          
          PY
