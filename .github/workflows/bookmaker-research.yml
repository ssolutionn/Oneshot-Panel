name: Public bookmaker reader investigation
on:
  push:
    branches: ["codex/bookmaker-public-probe"]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Extract public message field metadata and anonymous read transport
        run: |
          python3 - <<'PY'
          import json,re
          from urllib.request import Request,urlopen
          from concurrent.futures import ThreadPoolExecutor
          base="https://sportbook.sporthub.bet/widgets/sportbook/v1/modern/"
          def read(pair):
           label,file=pair
           try:
            with urlopen(Request(base+file,headers={"User-Agent":"Mozilla/5.0"}),timeout=15) as r:text=r.read(14000000).decode("utf8","replace")
            if label=="vendor":
             schemas=[]
             pattern=r"([A-Za-z_$][\w$]*)=new class extends [A-Za-z_$][\w$]*\{constructor\(\)\{super\(\x60([^\x60]+)\x60,"
             for m in re.finditer(pattern,text):
              start=m.end();pos=start;depth=0;quote=None;escaped=False
              for pos in range(start,len(text)):
               c=text[pos]
               if quote:
                if escaped:escaped=False
                elif c=="\\":escaped=True
                elif c==quote:quote=None
                continue
               if c in ('"',"'","\x60"):quote=c;continue
               if c=="[":depth+=1
               elif c=="]":
                depth-=1
                if depth==0:break
              raw=text[start:pos+1];fields=[]
              for f in re.finditer(r"\{no:(\d+),name:\x60([^\x60]+)\x60,kind:\x60([^\x60]+)\x60,([^}]+)\}",raw):
               tail=f[4];ref=re.search(r"T:\(\)=>([A-Za-z_$][\w$]*)",tail);scalar=re.search(r"T:(\d+)",tail)
               fields.append({"n":int(f[1]),"name":f[2],"kind":f[3],"type":ref[1] if ref else int(scalar[1]) if scalar else None,"repeat":"repeat:" in tail})
              schemas.append({"symbol":m[1],"name":m[2],"fields":fields})
             print("BB_SCHEMA_INDEX:",json.dumps(schemas),flush=True)
            else:
             patterns=r"(?:let|const|var|,)Qf=|requestWriter:|tournamentsSubscribeFull|setSettings|createPingRequest|PROTOBUF_CODE|LANGUAGES_RUSSIAN|format===|toBinary\("
             excerpts=[text[max(0,m.start()-300):m.end()+1800] for m in list(re.finditer(patterns,text))[:45]]
             print("BB_TRANSPORT:",json.dumps({"provider":label,"excerpts":excerpts},ensure_ascii=False),flush=True)
           except Exception as e:print("BB_TRANSPORT:",json.dumps({"provider":label,"error":str(e)[:100]}),flush=True)
          with ThreadPoolExecutor(max_workers=3) as pool:list(pool.map(read,[("vendor","vendor-core-BV73xSB5.js"),("app","App-Dkow5Vv7.js"),("constants","constants-e35Fscm2.js")]))
          
          PY
