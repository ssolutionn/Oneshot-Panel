name: Public bookmaker reader investigation
on:
  push:
    branches: ["codex/bookmaker-public-probe"]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Capture public Baltbet fixture and Sportbet sport contracts
        run: |
          python3 - <<'PY'
          import json,re
          from concurrent.futures import ThreadPoolExecutor
          from urllib.request import Request,urlopen
          def read(pair):
           label,url=pair
           try:
            with urlopen(Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json,text/javascript,*/*","bb_appSource":"UniRu"}),timeout=12) as r:text=r.read(6000000).decode("utf8","replace");status=r.status
            d={"provider":label,"status":status,"size":len(text)}
            if label=="baltbet-line":
             obj=json.loads(text);obj["leagues"]=[x for x in obj.get("leagues",[]) if re.search("cyber.?clash",x.get("title",""),re.I)]
             d["fixture"]=obj
            elif label=="sportbet-sports":d["body"]=json.loads(text)
            elif "events." in text or "bthm-server" in text:
             d["paths"]=list(dict.fromkeys(re.findall(r'["\x27\x60](/?events[^"\x27\x60]{0,100})',text)))[:40]
             d["excerpts"]=[text[max(0,m.start()-300):m.end()+800] for m in list(re.finditer(r"events\.upcoming|events\.top|bthm-server|sports/|/events\?|getEvents|eventsBySport",text))[:8]]
            else:return
            print("LINE_CONTRACT:",json.dumps(d,ensure_ascii=False),flush=True)
           except Exception as e:print("LINE_CONTRACT:",json.dumps({"provider":label,"error":str(e)[:100]}),flush=True)
          targets=[
           ("baltbet-line","https://events.baltbet.ru/api/prematch/sport/25/events?offset=all"),
           ("sportbet-sports","https://bthm-server.sportbet.ru/sports?status=prematch&lang=ru")
          ]
          
