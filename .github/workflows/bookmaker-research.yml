name: Public bookmaker reader investigation
on:
  push:
    branches: ["codex/bookmaker-public-probe"]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify complete Sportbet tables for CS2 and capture representative event schema
        run: |
          python3 - <<'PY'
          import json
          from urllib.request import Request,urlopen
          from concurrent.futures import ThreadPoolExecutor
          targets=[
           ("cs2-line","https://bthm-server.sportbet.ru/events.table?lang=ru&status=prematch&sport=esport-counter-strike"),
           ("cs2-live","https://bthm-server.sportbet.ru/events.table?lang=ru&status=live&sport=esport-counter-strike"),
           ("dota-line","https://bthm-server.sportbet.ru/events.table?lang=ru&status=prematch&sport=esport-dota"),
           ("dota-live","https://bthm-server.sportbet.ru/events.table?lang=ru&status=live&sport=esport-dota")
          ]
          def read(pair):
           label,url=pair
           try:
            with urlopen(Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"}),timeout=16) as r:obj=json.load(r);status=r.status
            obj.pop("uuid",None)
            text=json.dumps(obj,ensure_ascii=False)
            print("SPORTBET_TABLE:",json.dumps({"provider":label,"url":url,"status":status,"size":len(text),"body":obj},ensure_ascii=False)[:110000],flush=True)
           except Exception as e:print("SPORTBET_TABLE:",json.dumps({"provider":label,"error":str(e)[:100]}),flush=True)
          with ThreadPoolExecutor(max_workers=4) as pool:list(pool.map(read,targets))
          
          PY
