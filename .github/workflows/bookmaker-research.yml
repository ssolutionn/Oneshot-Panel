name: Public bookmaker reader investigation
on:
  push:
    branches: ["codex/bookmaker-public-probe"]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install ordinary public browser reader
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Resolve public native line requests
        run: |
          python3 - <<'PY'
          import asyncio,json,re
          from urllib.request import Request,urlopen
          from urllib.parse import urlsplit,urlunsplit,urljoin,parse_qsl,urlencode
          from playwright.async_api import async_playwright
          for label,url in [("sportbet","https://sportbet.ru/"),("baltbet-runtime","https://baltbet.ru/bundles/scripts/vue/uniru.bundle.js")]:
           try:
            with urlopen(Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=15) as r:text=r.read(14000000).decode("utf8","replace")
            scripts=re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)',text)
            data={"provider":label,"scripts":scripts}
            if label=="baltbet-runtime":
             data["runtime"]=[text[max(0,m.start()-50):m.end()+1800] for m in list(re.finditer(r"\.u=|\.p=|prematch-app|prematchServiceUrl.{0,150}/prematch",text))[-10:]]
             data["paths"]=list(dict.fromkeys(re.findall(r'["\x27](/prematch/[^"\x27]+)',text)))[:50]
            print("BROWSER_BOOTSTRAP:",json.dumps(data,ensure_ascii=False),flush=True)
           except Exception as e:print("BROWSER_BOOTSTRAP:",json.dumps({"provider":label,"error":type(e).__name__}),flush=True)
          def safe(url):
           p=urlsplit(url)
           return urlunsplit((p.scheme,p.netloc,p.path,urlencode([(k,v) for k,v in parse_qsl(p.query) if not re.search("token|session|uuid|finger|secret|sign|auth|hash|key",k,re.I)]),""))
          async def run():
           async with async_playwright() as p:
            browser=await p.chromium.launch(headless=True);semaphore=asyncio.Semaphore(2)
            async def observe(label,url):
             async with semaphore:
              context=await browser.new_context(locale="ru-RU");pg=await context.new_page();tasks=[];seen=set()
              async def route(r):
               path=urlsplit(r.request.url).path.lower()
               publicread=r.request.method=="POST" and re.search(r"/(?:prematch|line|tree|table)/",path) and not re.search("bet/|account|history|wallet|balance|login|auth|profile",path)
               if r.request.method in ("GET","HEAD") or publicread:await r.continue_()
               else:await r.abort()
              await context.route("**/*",route)
              async def reply(r):
               purl=urlsplit(r.url);host=purl.hostname or "";path=purl.path.lower()
               if not any(host==h or host.endswith("."+h) for h in ("sportbet.ru","baltbet.ru","melbet.ru","bet-m.ru","ligastavok.ru")):return
               if path.endswith(".js") and r.url not in seen:
                seen.add(r.url);print("PUBLIC_SCRIPT_URL:",json.dumps({"provider":label,"url":safe(r.url)}),flush=True);return
               content=r.headers.get("content-type","")
               if "json" not in content or any(s in path for s in ("session","account","wallet","balance","login","auth","history","user","profile","minio","registration")):return
               try:
                body=await asyncio.wait_for(r.text(),5)
                obj=json.loads(body)
                d={"provider":label,"url":safe(r.url),"status":r.status,"size":len(body),"keys":list(obj.keys())[:30] if isinstance(obj,dict) else ["array"],
                 "cyber":[body[max(0,m.start()-200):m.end()+1500] for m in list(re.finditer("cyber.?clash",body,re.I))[:6]]}
                print("FINAL_NATIVE_LINE:",json.dumps(d,ensure_ascii=False),flush=True)
               except Exception:pass
              def request(req):
               path=urlsplit(req.url).path.lower()
               if req.method!="POST" or any(s in path for s in ("account","wallet","balance","login","auth","history","profile","registration","metric","counter","analytics")):return
               parsed=urlsplit(req.url)
               if not any((parsed.hostname or "").endswith(h) for h in ("sportbet.ru","baltbet.ru","melbet.ru","bet-m.ru","ligastavok.ru")):return
               try:keys=list(json.loads(req.post_data or "{}").keys())[:20]
               except Exception:keys=[]
               print("PUBLIC_READ_CONTRACT:",json.dumps({"provider":label,"url":safe(req.url),"method":req.method,"bodyKeys":keys}),flush=True)
              pg.on("response",lambda r:tasks.append(asyncio.create_task(reply(r))))
              pg.on("request",request)
              pg.on("websocket",lambda ws:print("PUBLIC_LINE_SOCKET:",json.dumps({"provider":label,"url":safe(ws.url)}),flush=True))
              try:
               resp=await pg.goto(url,wait_until="domcontentloaded",timeout=22000);await pg.wait_for_timeout(8000)
               if label=="sportbet":
                button=pg.get_by_text("Спорт",exact=True)
                if await button.count():
                 await button.first.click(timeout=4000);await pg.wait_for_timeout(3000)
               text=await pg.locator("body").inner_text(timeout=5000)
               print("FINAL_NATIVE_PAGE:",json.dumps({"provider":label,"status":resp.status if resp else None,"url":pg.url,"text":text[:1000],
                "links":await pg.locator("a[href]").evaluate_all("(es)=>es.map(x=>({text:x.innerText.slice(0,60),href:x.href})).filter(x=>/counter|cs.?2|кибер|cyber|esport|спорт|линия/i.test(x.text+' '+x.href)).slice(0,30)")},ensure_ascii=False),flush=True)
               if tasks:
                try:await asyncio.wait_for(asyncio.gather(*tasks,return_exceptions=True),7)
                except asyncio.TimeoutError:pass
              except Exception as e:print("FINAL_NATIVE_PAGE:",json.dumps({"provider":label,"error":type(e).__name__}),flush=True)
              await context.close()
            await asyncio.gather(*[observe(*pair) for pair in [
             ("baltbet","https://baltbet.ru/prematch/cybersport"),
             ("sportbet","https://sportbet.ru/"),
             ("melbet","https://melbet.ru/"),
             ("betm","https://bet-m.ru/"),
             ("ligastavok","https://www.ligastavok.ru/bets/cybersport")
            ]])
            await browser.close()
          asyncio.run(run())
          
          PY
