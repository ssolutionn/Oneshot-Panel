name: Public bookmaker reader investigation
on:
  push:
    branches: ["codex/bookmaker-public-probe"]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read anonymous public tournament through documented message fields
        run: |
          python3 - <<'PY'
          import json,re,os
          from urllib.request import Request,urlopen
          base="https://sportbook.sporthub.bet/widgets/sportbook/v1/modern/"
          def get(file):
           with urlopen(Request(base+file,headers={"User-Agent":"Mozilla/5.0"}),timeout=15) as r:return r.read(3000000).decode("utf8","replace")
          src=get("vendor-core-BV73xSB5.js")
          export=src[src.rfind("export{"):]
          def alias(name):
           m=re.search(r"([\w$]+) as "+name+r"(?:,|\})",export)
           if not m:raise ValueError("public export missing: "+name)
           return m[1]
          lang_symbol=alias("ur")
          m=re.search(re.escape(lang_symbol)+r"\.RU=(\d+)",src)
          if not m:
           definition=re.search(r"\b"+re.escape(lang_symbol)+r"=(.{0,3500})",src)
           m=re.search(r"(?:\.RU=|RU:)(\d+)",definition[1]) if definition else None
          if not m:raise ValueError("public RU enum missing")
          language=int(m[1])
          period_symbol=alias("yn");filter_value=None
          m=re.search(re.escape(period_symbol)+r"=\{([^}]+)\}",src)
          if m:
           v=re.search(r"ALL:[\x60\x22\x27]([^\x60\x22\x27]*)",m[1])
           if v:filter_value=v[1]
          runtime=get("runtime-env.js")
          m=re.search(r'"FEED_WS_URL_TEMPLATE"\s*:\s*"([^"]+)"',runtime)
          if not m:raise ValueError("public feed address missing")
          url=m[1].replace("{sporthubPartnerName}","ru")
          if not re.fullmatch(r"wss://ru-ws2\.sporthub\.bet:443/api/tree_ws/v1\?uuid=[0-9a-f-]{36}",url):raise ValueError("unexpected public feed address")
          os.makedirs("work",exist_ok=True)
          open("work/public-feed.json","w").write(json.dumps({"language":language,"timeFilter":filter_value,"url":url}))
          print("BB_PUBLIC_DEFAULTS:",json.dumps({"language":language,"timeFilter":filter_value}),flush=True)
          for file in ("vendor-core-BV73xSB5.js","App-Dkow5Vv7.js","BetShareModal-D1mFtPEC.js"):
           code=get(file)
           fragments=[code[max(0,m.start()-300):m.end()+1600] for m in list(re.finditer(r"new WebSocket\(|protocols:|Sec-WebSocket-Protocol|WebSocketProtocol|3003|format===|serialize\(",code))[:18]]
           print("BB_WIRE_TRANSPORT:",json.dumps({"file":file,"excerpts":fragments}),flush=True)
          
          PY
          node work/public-probe/read-bb.mjs
