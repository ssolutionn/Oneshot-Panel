name: OBS runtime regression

on:
  pull_request:
    branches: ["claude/gracious-sagan-apztcc"]
    paths: ["obs.js", "live.js", "obs-bridge.js", "assets/veto-overlay/**", "scripts/qa_obs_runtime.py", ".github/workflows/obs-runtime.yml"]

permissions:
  contents: read

jobs:
  obs:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official OBS and runtime QA tools
        run: |
          curl --fail --location --retry 2 https://github.com/obsproject/obs-studio/releases/download/32.2.2/OBS-Studio-32.2.2-Ubuntu-24.04-x86_64.deb --output /tmp/obs-studio.deb
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/obs-studio.deb xvfb libgl1-mesa-dri
          python3 -m pip install playwright websockets
          python3 -m playwright install --with-deps ${{ matrix.browser }}
      - name: Test actual OBS browser source and WebSocket events
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_QPA_PLATFORM: xcb
          QA_BROWSER: ${{ matrix.browser }}
        run: |
          node server.js > /tmp/oneshot-server.log 2>&1 &
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 scripts/qa_obs_runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obs-runtime-qa-${{ matrix.browser }}
          path: artifacts/obs-runtime/
          if-no-files-found: warn
