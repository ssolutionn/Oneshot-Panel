name: Veto overlay preview

on:
  push:
    branches: ["codex/veto-overlay-design"]
  pull_request:
    branches: ["claude/gracious-sagan-apztcc"]
    paths:
      - "assets/veto-overlay/**"
      - "scripts/qa_veto_overlay.py"
      - "test/veto-overlay.test.js"
      - ".github/workflows/veto-overlay-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Syntax and existing regressions
        run: |
          npm run check
          for file in assets/veto-overlay/*.js; do node --check "$file"; done
          npm test
      - name: Install browser renderer
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Render full frame, transparent strip and PNG exports
        run: |
          node server.js > "${RUNNER_TEMP}/veto-server.log" 2>&1 &
          python3 scripts/qa_veto_overlay.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cyberclash-veto-preview
          path: artifacts/veto-overlay/
          if-no-files-found: error
