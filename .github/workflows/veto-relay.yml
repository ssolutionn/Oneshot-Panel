name: Veto server transport
on:
  pull_request:
    paths: ["veto*", "index.html", "live.js", "server.js", "_headers", "netlify.toml", "assets/veto-relay*", "assets/veto-short*", "server/**", "functions/**", "test/veto-*.test.js", "scripts/qa_veto_site.py", "scripts/qa_veto_resilience.py", "scripts/qa_veto_relay*.py", ".github/workflows/veto-relay.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax, unit tests and generated site
        run: |
          npm run check
          npm test
          node scripts/build-veto-site.mjs
          python3 claude-artifact/build_oneshot_artifact.py
          git diff --exit-code -- claude-artifact/oneshot-panel.html
      - name: Install browser QA
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium webkit
      - name: Cloudflare Durable Objects, readable routes and browser bootstrap locally
        run: python3 scripts/qa_veto_relay_cloudflare.py
      - name: Server rooms in Chromium and mobile WebKit, old VDO regression
        run: |
          node server.js > /tmp/relay-server.log 2>&1 &
          python3 scripts/qa_veto_relay_overlay.py
          python3 scripts/qa_veto_site.py --url http://127.0.0.1:3000 --server --browser chromium --artifacts artifacts/server-chromium
          python3 scripts/qa_veto_site.py --url http://127.0.0.1:3000 --server --browser webkit --artifacts artifacts/server-webkit
          python3 scripts/qa_veto_site.py --url http://127.0.0.1:3000 --server --pretty-links --focus-match --browser chromium --artifacts artifacts/short-chromium
          python3 scripts/qa_veto_site.py --url http://127.0.0.1:3000 --server --pretty-links --focus-match --browser webkit --artifacts artifacts/short-webkit
          python3 scripts/qa_veto_site.py --url http://127.0.0.1:3000 --browser chromium --artifacts artifacts/vdo
          python3 scripts/qa_veto_resilience.py --url http://127.0.0.1:3000 --browser chromium
          python3 scripts/qa_veto_resilience.py --url http://127.0.0.1:3000 --browser webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veto-relay-validation
          path: |
            artifacts/
            dist-veto/
