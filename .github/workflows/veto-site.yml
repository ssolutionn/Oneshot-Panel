name: Veto site regression

# The captains' veto site end to end: fake VDO.Ninja routing in Chromium and
# mobile WebKit, and the real VDO.Ninja data channels in Chromium.
on:
  workflow_dispatch:
  push:
    branches: ["claude/gracious-sagan-apztcc"]
    paths: ["veto.html", "veto.js", "veto.css", "veto-room.js", "vdo.js", "scripts/qa_veto_site.py", ".github/workflows/veto-site.yml"]

permissions:
  contents: read

jobs:
  veto:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, vdo: fake }
          - { browser: webkit, vdo: fake }
          - { browser: chromium, vdo: real }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps ${{ matrix.browser }}
      - name: Veto site scenarios
        run: |
          node server.js > /tmp/oneshot-server.log 2>&1 &
          sleep 1
          python3 scripts/qa_veto_site.py --url http://127.0.0.1:3000 --browser ${{ matrix.browser }} \
            ${{ matrix.vdo == 'real' && '--real-vdo' || '' }} --artifacts artifacts/veto-${{ matrix.browser }}-${{ matrix.vdo }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veto-site-${{ matrix.browser }}-${{ matrix.vdo }}
          path: artifacts/
          if-no-files-found: warn
