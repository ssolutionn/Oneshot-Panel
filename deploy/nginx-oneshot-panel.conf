# Oneshot Panel за nginx: https://panel.<твой-домен>
# Панель — это process (server.js) на 127.0.0.1:3000 (systemd-юнит
# oneshot-panel.service), nginx терминирует HTTPS и проксирует всё,
# включая /api/* — поэтому CSP в server.js остаётся рабочим.
server {
    listen 80;
    listen [::]:80;
    server_name panel.oneshot.su;   # ← замени на свой домен
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.oneshot.su;   # ← замени на свой домен

    ssl_certificate     /etc/letsencrypt/live/panel.oneshot.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.oneshot.su/privkey.pem;

    # Заголовки безопасности задаёт сам server.js — здесь их не дублируем,
    # чтобы не разойтись (тесты сверяют их в четырёх местах).

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # «Отправить в OBS» и оверлей вето держат долгие соединения.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Крупные upload (фото событий): по умолчанию nginx 1m.
    client_max_body_size 24m;
}
