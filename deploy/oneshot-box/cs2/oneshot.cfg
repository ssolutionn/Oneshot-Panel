// Copy to the server's cfg directory and replace placeholders locally.
log on
mp_logdetail 3
// Keep the token local; configure only on a trusted LAN or use TLS/reverse proxy.
logaddress_add_http "http://PANEL_LAN_IP:3000/api/cs2-log?token=REPLACE_WITH_PANEL_TOKEN"
game_type 0
game_mode 1
mp_limitteams 0
mp_autoteambalance 0
mp_freezetime 15
mp_roundtime 1.92
mp_roundtime_defuse 1.92
mp_maxrounds 24
mp_overtime_enable 1
mp_overtime_maxrounds 6
mp_overtime_startmoney 10000
mp_startmoney 800
// Set RCON password via SRCDS_RCONPW in the private environment file.
sv_cheats 0
sv_lan 0
rate 786432
sv_maxrate 0
sv_minrate 786432
sv_parallel_sendsnapshot 1
