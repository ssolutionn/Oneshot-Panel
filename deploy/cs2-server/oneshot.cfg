// ==========================================
// ONESHOT PANEL: Конфигурация CS2 сервера
// ==========================================

// 1. Базовое логирование (обязательно для судейского журнала)
log on                    // Включает запись логов сервера
mp_logdetail 3            // Уровень детализации логов 3: фиксирует урон, попадания по частям тела и оружие

// 2. Интеграция с Oneshot Panel (отправка логов по HTTP в реальном времени)
// ВАЖНО: Замени IP и порт на адрес твоего сервера с панелью, а токен — на токен из .cs2-data/token
logaddress_add_http "http://192.168.1.100:3000/api/cs2-log?token=ТВОЙ_ТОКЕН_ИЗ_ПАНЕЛИ"

// 3. Настройки соревновательного матча (Valve Competitive / Premier rules)
game_type 0
game_mode 1
mp_limitteams 0
mp_autoteambalance 0
mp_freezetime 15
mp_roundtime 1.92
mp_roundtime_defuse 1.92
mp_maxrounds 24
mp_overtime_enable 1
mp_overtime_maxrounds 6
mp_overtime_startmoney 10000
mp_startmoney 800

// 4. Безопасность и RCON
rcon_password "OneshotSecureRcon2026!"
sv_cheats 0
sv_lan 0

// 5. Оптимизация сети под киберспорт (Source 2 Sub-tick)
rate 786432
sv_maxrate 0
sv_minrate 786432
sv_parallel_sendsnapshot 1

say "=== CS2 Server successfully configured for Oneshot Panel ==="
