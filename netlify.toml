# Static site, nothing to compile: scripts/build-site.sh (shared with
# Cloudflare Pages and CI) copies the files server.js serves into public/.
[build]
  command = "sh scripts/build-site.sh"
  publish = "public"

# Same security headers as server.js (test/server.test.js keeps them in sync).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' https://docs.google.com https://open.faceit.com https://oneshot-veto.pages.dev https://oneshot-veto.cyberclash.workers.dev ws://127.0.0.1:* ws://localhost:*; frame-src https://vdo.ninja https://cdn-backup.vdo.ninja; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
