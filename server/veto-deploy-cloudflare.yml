name: Deploy veto to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: veto-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The API token is NOT a job-wide variable: only the three steps that call
    # Cloudflare get it, so npx, pip and the browser installer never see it.
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Worker and Pages Functions
        run: |
          npx --yes wrangler@4.151.1 deploy --dry-run --outdir "$RUNNER_TEMP/veto-worker"
          mkdir -p "$RUNNER_TEMP/veto-pages"
          cp index.html veto.html veto.js veto.css veto-room.js vdo.js core.js _headers "$RUNNER_TEMP/veto-pages/"
          cp -R assets "$RUNNER_TEMP/veto-pages/assets"
          npx --yes wrangler@4.151.1 pages functions build functions --outdir "$RUNNER_TEMP/veto-pages/_worker.js" --output-routes-path "$RUNNER_TEMP/veto-pages/_routes.json"
          node --check "$RUNNER_TEMP/veto-pages/_worker.js/index.js"
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync(process.env.RUNNER_TEMP + '/veto-pages/wrangler.jsonc', JSON.stringify({
            name: 'oneshot-veto', compatibility_date: '2026-10-01', pages_build_output_dir: '.',
            services: [{binding: 'VETO_RELAY_SERVICE', service: 'oneshot-veto'}]
          }, null, 2));
          JS
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) throw Error('Add repository secret: CLOUDFLARE_API_TOKEN');
          if (!process.env.CLOUDFLARE_ACCOUNT_ID) {
            const api = async path => {
              const response = await fetch('https://api.cloudflare.com/client/v4' + path, {
                headers: {Authorization: 'Bearer ' + token}
              });
              const data = await response.json();
              return {ok: response.ok && data.success, data};
            };
            const accounts = await api('/accounts?per_page=50');
            if (!accounts.ok) throw Error('Set CLOUDFLARE_ACCOUNT_ID: token cannot list accounts (HTTP/API permission).');
            const matches = [];
            for (const account of accounts.data.result) {
              const project = await api('/accounts/' + account.id + '/pages/projects/oneshot-veto');
              if (project.ok && project.data.result.subdomain === 'oneshot-veto.pages.dev') matches.push(account.id);
            }
            if (matches.length !== 1) throw Error('Set CLOUDFLARE_ACCOUNT_ID: could not identify exactly one account owning oneshot-veto.pages.dev.');
            console.log('::add-mask::' + matches[0]);
            appendFileSync(process.env.GITHUB_ENV, 'CLOUDFLARE_ACCOUNT_ID=' + matches[0] + '\n');
            console.log('Detected the account owning the existing Pages project.');
          }
          JS
      - name: Deploy Worker and Durable Object migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.151.1 deploy --config wrangler.jsonc
      - name: Deploy Pages and API route
        working-directory: ${{ runner.temp }}/veto-pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.151.1 pages deploy . --project-name oneshot-veto --branch main --commit-hash "$GITHUB_SHA" --commit-message 'Verified veto release'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser for public verification
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Verify public assets and relay health
        run: python3 scripts/verify_deployment.py
