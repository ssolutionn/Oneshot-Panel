name: Deploy veto to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: veto-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Worker and Pages Functions
        run: |
          npx --yes wrangler@4.151.1 deploy --dry-run --outdir "$RUNNER_TEMP/veto-worker"
          mkdir -p "$RUNNER_TEMP/veto-pages"
          cp index.html veto.html veto.js veto.css veto-room.js vdo.js core.js _headers "$RUNNER_TEMP/veto-pages/"
          cp -R assets "$RUNNER_TEMP/veto-pages/assets"
          npx --yes wrangler@4.151.1 pages functions build functions --outfile "$RUNNER_TEMP/veto-pages/_worker.js" --output-routes-path "$RUNNER_TEMP/veto-pages/_routes.json"
      - name: Check Cloudflare credentials
        run: |
          node --input-type=module <<'JS'
          const missing = ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID'].filter(key => !process.env[key]);
          if (missing.length) throw Error('Add these repository secrets/variables: ' + missing.join(', '));
          JS
      - name: Deploy Worker and Durable Object migration
        run: npx --yes wrangler@4.151.1 deploy --config wrangler.jsonc
      - name: Deploy Pages and API route
        working-directory: ${{ runner.temp }}/veto-pages
        run: npx --yes wrangler@4.151.1 pages deploy . --project-name oneshot-veto --branch main --commit-hash "$GITHUB_SHA" --commit-message 'Verified veto release'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser for public verification
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Verify public assets and relay health
        run: python3 scripts/verify_deployment.py
