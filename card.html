<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карточка игрока · Oneshot Panel</title>
  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="/card.css">
  <script type="module" src="/card.js"></script>
</head>
<body data-layout="no-photo">
  <main class="card" id="card" aria-label="Карточка игрока CyberClash">
    <img class="card-background" id="cardBackground" alt="" hidden>
    <div class="card-portrait" aria-hidden="true">
      <img class="card-photo" id="cardPhoto" alt="" hidden>
    </div>
    <div class="card-shade" aria-hidden="true"></div>
    <img class="card-event" id="tournamentLogo" alt="CyberClash" hidden>
    <section class="card-identity" aria-label="Игрок и команда">
      <img class="card-emblem" id="cardEmblem" alt="" hidden>
      <div class="card-text">
        <div class="card-team">
          <span class="card-logo" id="cardLogo" hidden><img alt=""></span>
          <span id="cardTeam"></span>
        </div>
        <h1 class="card-nick" id="cardNick">Игрок</h1>
        <span class="card-rule" aria-hidden="true"></span>
      </div>
    </section>
  </main>
</body>
</html>
